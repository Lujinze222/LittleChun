<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 小纯智能体</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body {
    background: radial-gradient(circle at 20% 10%, #1f2138, #0a0a12 80%);
    min-height: 100vh; display:flex; justify-content:center; align-items:center; padding:16px;
  }
  .app {
    width:100%; max-width:700px; height:680px; max-height:92vh;
    background:#0d0e16; border-radius:28px; overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow: 0 30px 60px -12px rgba(0,0,0,.8), 0 0 0 1px #2e3048 inset;
  }
  header {
    padding:16px 22px; background:#141621; border-bottom:1px solid #262941;
    display:flex; align-items:center; gap:12px;
  }
  .face {
    width:44px; height:44px; border-radius:50%; background:#3a3d5e;
    display:flex; align-items:center; justify-content:center; font-size:24px;
    box-shadow:0 0 0 2px #5f62a0; animation: wobble 4s infinite ease-in-out;
  }
  @keyframes wobble {
    0%,100% { transform: rotate(0deg); }
    25% { transform: rotate(6deg); }
    75% { transform: rotate(-6deg); }
  }
  header h1 { color:#eeedfa; font-size:1.15rem; font-weight:600; }
  header p { color:#8b8eb5; font-size:.75rem; margin-top:2px; }

  #chat {
    flex:1; overflow-y:auto; padding:20px 18px;
    display:flex; flex-direction:column; gap:14px; background:#08090f;
  }
  #chat::-webkit-scrollbar { width:5px; }
  #chat::-webkit-scrollbar-thumb { background:#3b3e5c; border-radius:8px; }

  .msg { display:flex; max-width:86%; animation:pop .18s ease-out; }
  @keyframes pop { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .msg.ai { align-self:flex-start; }
  .msg.user { align-self:flex-end; }
  .bubble {
    padding:11px 16px; border-radius:20px; font-size:.94rem; line-height:1.5;
    word-break:break-word; white-space:pre-wrap;
  }
  .msg.ai .bubble {
    background:#1b1d2e; color:#d8d7f0; border:1px solid #2c2e46;
    border-bottom-left-radius:6px;
  }
  .msg.user .bubble {
    background:#47437a; color:#fff; border:1px solid #6a66a8;
    border-bottom-right-radius:6px;
  }

  .thinking .bubble {
    background:#1b1d2e; border:1px solid #2c2e46; display:flex; gap:6px; align-items:center;
  }
  .dot {
    width:7px; height:7px; background:#9b9ec9; border-radius:50%;
    animation:bounce 1.1s infinite ease-in-out;
  }
  .dot:nth-child(2){animation-delay:.15s;} .dot:nth-child(3){animation-delay:.3s;}
  @keyframes bounce {
    0%,60%,100% { transform:translateY(0); opacity:.4; }
    30% { transform:translateY(-5px); opacity:1; }
  }

  .input-bar {
    padding:14px 18px; background:#11121c; border-top:1px solid #25283e;
    display:flex; gap:10px; align-items:center;
  }
  #inp {
    flex:1; padding:13px 18px; border-radius:40px; border:1px solid #2d3049;
    background:#1a1c2a; color:#f0f0fa; font-size:.95rem; outline:none;
    transition:border .15s, box-shadow .15s;
  }
  #inp:focus { border-color:#787bcc; box-shadow:0 0 0 3px rgba(120,123,204,.22); }
  #inp::placeholder { color:#5f6288; font-style:italic; }
  #btn {
    width:52px; height:52px; border-radius:50%; border:none; background:#5c5c9e;
    color:#fff; font-size:22px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, transform .1s;
    box-shadow:0 6px 14px rgba(0,0,0,.4);
  }
  #btn:hover { background:#7272c4; }
  #btn:active { transform:scale(.93); }
  #btn:disabled { background:#393b56; color:#6f7299; cursor:not-allowed; transform:none; box-shadow:none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="face">🤖</div>
    <div>
      <h1>小纯</h1>
      <p>小纯智能体</p>
    </div>
  </header>
  <div id="chat"></div>
  <div class="input-bar">
    <input id="inp" type="text" placeholder="问小纯点什么……它会用通顺但疯癫的方式回答" autocomplete="off" autofocus>
    <button id="btn">➤</button>
  </div>
</div>

<script>
/* =========================================================
   小纯智能体 · 通顺但疯癫引擎
   ========================================================= */

const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const draw = (pool, n) => shuffle(pool).slice(0, n);

const NOUNS = [
  "橡皮擦","袜子","冰箱","烤面包机","微波炉","洗衣机","充电器","橡皮鸭",
  "订书机","仙人掌","蓝牙音箱","拖鞋","雨伞","泡面","抽屉","路灯",
  "数学公式","外星人","蓝牙耳机","橡皮筋","鼠标垫","回形针","暖水袋",
  "扫地机器人","电饭锅","键盘","摄像头","指甲刀","玩具熊","闹钟",
  "保温杯","手电筒","数据线","马克杯","牙签","遥控器","气球","铅笔",
  "透明胶带","梳子","镜子","指南针","卷尺","打火机","放大镜"
];

const ADJS = [
  "嘎嘎叫的","会唱歌的","正在打呼噜的","半透明的","带电的","反光的",
  "会说话的","正在跳舞的","被腌渍过的","会背古诗的","会算命的",
  "会做菜的","被复印过七次的","会倒立的","正在掉毛的","会吹口哨的",
  "被冻住的","会写代码的","被踩扁的","会变色的","正在叹气的",
  "会算数的","会开会的","被遗忘的","正在充电的","会撒谎的",
  "会倒着走的","被煮过的","会发光的","会眨眼的","正在融化的",
  "会讲冷笑话的","被折成纸鹤的","会偷偷溜走的"
];

const PLACES = [
  "在冰箱里","在洗衣机滚筒里","在月亮背面","在电梯井里","在路由器旁边",
  "在抽屉最深处","在泡面碗底","在公交站牌后面","在微波炉里面","在袜子里面",
  "在蓝牙音箱里面","在订书机夹层里","在时间裂缝里","在周四的下午","在空调出风口",
  "在键盘缝隙里","在书架顶层","在地毯下面","在冷冻层里","在水杯底部",
  "在镜子背面","在衣柜角落","在垃圾桶旁边","在天花板夹层里","在沙发缝里"
];

const CONTAINERS = [
  "冰箱","洗衣机","微波炉","抽屉","袜子","书包","充电器","泡面碗",
  "电梯","行李箱","纸箱","罐头","保温杯","鞋盒","文件袋","花盆"
];

const VERBS = [
  "腌渍","复印","舔","背诵","踢","煮","叠","发射","跳过",
  "啃","揉","折叠","摇晃","擦","拍","卷","塞","浇","烤"
];

function extractKeywords(text) {
  const re = /[a-zA-Z]{2,}|\d+|[一-龥]{2,}/g;
  const found = text.match(re) || [];
  return [...new Set(found)];
}

const FALLBACK_KWS = ["香蕉","周四","外星人","泡面","路灯","充电器","橡皮擦","遥控器"];

function generateWeirdReply(userText) {
  let kws = extractKeywords(userText);
  if (kws.length < 2) {
    const extra = shuffle(FALLBACK_KWS.filter(w => !kws.includes(w)));
    kws = kws.concat(extra.slice(0, 2 - kws.length));
  }
  kws = shuffle(kws).slice(0, 2);

  const nouns = draw(NOUNS, 4);
  const adjs = draw(ADJS, 2);
  const place = pick(PLACES);
  const container = pick(CONTAINERS);
  const verb = pick(VERBS);

  const used = new Set(nouns);
  const cleanKws = kws.filter(k => !used.has(k));
  while (cleanKws.length < 2) {
    const extra = NOUNS.find(t => !used.has(t) && !cleanKws.includes(t));
    if (!extra) break;
    cleanKws.push(extra);
    used.add(extra);
  }
  const k0 = cleanKws[0] || nouns[0];
  const k1 = cleanKws[1] || nouns[1];

  const structures = [
    () => `${k0}其实是一个${adjs[0]}${nouns[0]}，被${verb}到了${place}。`,
    () => `我${verb}了一下${nouns[0]}，结果它变成了一个${adjs[0]}${nouns[1]}。`,
    () => `${k0}和${k1}的区别，就像${adjs[0]}${nouns[0]}和${container}的区别一样明显。`,
    () => `根据我的观察，${nouns[0]}会在${place}偷偷${verb}${nouns[1]}。`,
    () => `如果${k0}是一个${adjs[0]}${nouns[0]}，那${nouns[1]}一定是个${adjs[1]}${nouns[2]}。`,
    () => `我梦到${nouns[0]}${place}变成了一个${adjs[0]}${nouns[1]}。`,
    () => `${k0}的本质，其实是一个${adjs[0]}${nouns[0]}${place}${verb}${nouns[1]}。`,
    () => `我查了一下，${nouns[0]}被${nouns[1]}${verb}过${Math.floor(Math.random()*7)+1}次。`,
    () => `${nouns[0]}告诉我，${k0}应该${verb}${nouns[1]}。`,
    () => `我把${k0}放进了${container}，结果${k1}变成了一个${adjs[0]}${nouns[0]}。`,
    () => `${nouns[0]}之所以这么${adjs[0].replace("的","")}，是因为它被${nouns[1]}${verb}过。`,
    () => `在我这里，${k0}就是${adjs[0]}${nouns[0]}，没有为什么。`,
  ];

  let idx;
  do {
    idx = Math.floor(Math.random() * structures.length);
  } while (idx === lastStructureIndex && structures.length > 1);
  lastStructureIndex = idx;

  return structures[idx]();
}

let lastStructureIndex = -1;

/* ---------- UI ---------- */
const chatEl = document.getElementById('chat');
const inpEl = document.getElementById('inp');
const btnEl = document.getElementById('btn');
let busy = false;

function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

function addMsg(text, who, thinking = false) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${who}${thinking ? ' thinking' : ''}`;
  const b = document.createElement('div');
  b.className = 'bubble';
  if (thinking) {
    b.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  } else {
    b.textContent = text;
  }
  wrap.appendChild(b);
  chatEl.appendChild(wrap);
  scrollBottom();
  return wrap;
}

function send() {
  if (busy) return;
  const text = inpEl.value.trim();
  if (!text) {
    inpEl.placeholder = '小纯在等你说话……';
    setTimeout(() => inpEl.placeholder = '问小纯点什么……它会用通顺但疯癫的方式回答', 1200);
    return;
  }
  inpEl.value = '';
  addMsg(text, 'user');
  const think = addMsg('', 'ai', true);
  busy = true;
  btnEl.disabled = true;

  const delay = 400 + Math.random() * 600;
  setTimeout(() => {
    think.remove();
    const reply = generateWeirdReply(text);
    addMsg(reply, 'ai');
    busy = false;
    btnEl.disabled = false;
    inpEl.focus();
  }, delay);
}

btnEl.addEventListener('click', send);
inpEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); send(); } });

window.addEventListener('load', () => {
  addMsg('你好，我是小纯。', 'ai');
  inpEl.focus();
});
</script>
</body>
</html>
